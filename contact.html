    <nav class="nav" aria-label="Navigation principale">

<main id="main" class="wrap contact-page">
  <p class="eyebrow">Contact</p>
  <h1 class="h-xxl c-title">On construit un truc ensemble ?</h1>
  <div class="c-card-wrap">
    <div class="flip-card flipped" id="flip-card">
      <div class="flip-inner">
        <div class="face front">
          <div class="face-top"><span class="eyebrow">Portfolio</span><svg aria-hidden="true" width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 8 C12 12 12 16 8 20"/><path d="M13 5 C19 11 19 17 13 23"/><path d="M18 2 C26 10 26 18 18 26"/></svg></div>
          <div><div class="card-name" id="card-name"></div><div class="card-sub" id="card-sub"></div></div>
        </div>
        <div class="face back">
          <div class="stripe"></div>
          <div class="sign-row"><div class="sign" id="card-sign"></div><div class="cvv" id="card-cvv"></div></div>
          <div class="back-rows" id="back-rows"></div>
        </div>
      </div>
    </div>
    <button type="button" class="flip-btn" id="flip-btn" aria-pressed="true">Revenir au recto</button>
  </div>
  <div class="c-actions" id="contact-links"></div>
