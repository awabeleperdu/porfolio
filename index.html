<!doctype html>
<html lang="fr" data-theme="pro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Portfolio : projets, applications web et programmes Python exécutables dans le navigateur.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<a class="skip" href="#projets">Aller aux projets</a>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="./"><span class="avatar avatar-s" id="avatar-s" aria-hidden="true"></span><span id="brand-name">Portfolio</span></a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="#projets" data-nav="projets">Projets</a>
      <a href="#apropos" data-nav="apropos">À propos</a>
      <a href="#contact" data-nav="contact">Contact</a>
      <div class="theme-picker" id="theme-picker" role="group" aria-label="Choisir le thème"></div>
    </nav>
  </div>
</header>

<main id="main">
  <section class="hero wrap" id="accueil">
    <div class="hero-text">
      <p class="eyebrow" id="hero-role"></p>
      <h1 id="hero-title"></h1>
      <p class="lead" id="hero-intro"></p>
      <div class="actions">
        <a class="btn btn-primary btn-lg" href="#projets" data-nav="projets">Voir les projets</a>
        <a class="btn btn-ghost btn-lg" href="#contact" data-nav="contact">Me contacter</a>
      </div>
    </div>
    <div class="hero-card">
      <div class="flip-card" id="flip-card">
        <div class="flip-inner">
          <div class="face front">
            <div class="face-top"><span class="eyebrow">Portfolio</span><svg aria-hidden="true" width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 8 C12 12 12 16 8 20"/><path d="M13 5 C19 11 19 17 13 23"/><path d="M18 2 C26 10 26 18 18 26"/></svg></div>
            <div>
              <div class="card-name" id="card-name"></div>
              <div class="card-sub" id="card-sub"></div>
            </div>
          </div>
          <div class="face back">
            <div class="stripe"></div>
            <div class="sign-row"><div class="sign" id="card-sign"></div><div class="cvv" id="card-cvv"></div></div>
            <div class="back-rows" id="back-rows"></div>
          </div>
        </div>
      </div>
      <button type="button" class="flip-btn" id="flip-btn" aria-pressed="false">Retourner la carte</button>
    </div>
  </section>

  <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

  <section class="wrap section" id="projets">
    <div class="section-head">
      <div>
        <p class="eyebrow" id="projets-count">01 · projets</p>
        <h2 class="h-xl">Ce que j’ai construit</h2>
      </div>
      <div class="chips" id="filters" role="group" aria-label="Filtrer par catégorie"></div>
    </div>
    <div id="featured"></div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden></p>
  </section>

  <section class="wrap section" id="apropos">
    <p class="eyebrow">02 · à propos</p>
    <div class="about">
      <figure class="portrait" id="portrait" role="img" aria-label="Portrait"></figure>
      <div class="panel about-bio">
        <h2 class="h-l" id="about-title"></h2>
        <p id="about-bio"></p>
      </div>
      <div class="panel about-skills">
        <p class="eyebrow">Compétences</p>
        <div id="skills"></div>
      </div>
    </div>
  </section>

  <section class="wrap section" id="contact">
    <p class="eyebrow">03 · contact</p>
    <h2 class="h-xxl">On construit<br>un truc ?</h2>
    <div class="contact-links" id="contact-links"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap bar">
    <span id="footer-name"></span>
    <a href="admin.html" class="footer-admin">Admin</a>
  </div>
</footer>

<noscript><p class="noscript">Ce site a besoin de JavaScript pour afficher les projets.</p></noscript>
<script type="module" src="site.js"></script>
</body>
</html>
